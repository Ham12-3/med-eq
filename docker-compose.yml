services:
  db:
    image: postgres:16-alpine
    container_name: medasset-db
    environment:
      POSTGRES_USER: medasset
      POSTGRES_PASSWORD: medasset_dev
      POSTGRES_DB: medasset
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db/docker-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U medasset -d medasset"]
      interval: 2s
      timeout: 3s
      retries: 30

volumes:
  pgdata:
